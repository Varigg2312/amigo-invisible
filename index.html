<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Operación Amigo Invisible</title>
<meta name="description" content="Sorteo secreto del amigo invisible: cada agente recibe su expediente clasificado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Special+Elite&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='40' rx='4' fill='%23d9c08a'/%3E%3Cpath d='M6 18h20l4 6h28' fill='none' stroke='%238a6d34' stroke-width='3'/%3E%3Crect x='14' y='32' width='36' height='8' fill='%23111'/%3E%3C/svg%3E">
<style>
/* Concepto: mesa de operaciones de noche. La central reparte expedientes (carpetas manila);
   cada agente desbloquea el suyo con la huella y rasca la franja tachada para ver su objetivo.
   Un solo tema oscuro a propósito: es una operación nocturna. */
:root{
  color-scheme:dark;
  --desk:#0f1720;          /* mesa de noche */
  --desk-2:#16212d;
  --manila:#e2cc98;        /* carpeta */
  --manila-2:#d3b979;
  --manila-ink:#2b2416;    /* tinta máquina de escribir */
  --stamp:#d2323c;         /* sello CONFIDENCIAL */
  --lamp:#ffc857;          /* luz del flexo */
  --text:#e9edf2;
  --muted:#93a1b1;
  --line:#2a3a4b;
  --ok:#57c785;
  --redact:#0b0b0d;
  --stencil:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;
  --type:"Special Elite","Courier New",Courier,monospace;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--desk)}
body{margin:0;min-height:100%;color:var(--text);font:16px/1.5 var(--ui);
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%, rgba(255,200,87,.16), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.025) 31px 32px),
    repeating-linear-gradient(90deg, transparent 0 31px, rgba(255,255,255,.025) 31px 32px),
    var(--desk);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:grid;gap:26px}
h1,h2,h3{margin:0;font-family:var(--stencil);font-weight:900;line-height:.95;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.label{font-family:var(--type);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
p{margin:0}

/* Franja de clasificación */
.strip{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--type);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--stamp);border-block:1px dashed rgba(210,50,60,.45);padding-block:6px}
.hero{display:grid;gap:12px}
.hero h1{font-size:clamp(52px,13vw,128px);color:var(--text)}
.hero h1 em{font-style:normal;color:var(--lamp);display:block}
.hero p{max-width:58ch;color:var(--muted)}

/* Paneles de la central */
.panel{background:var(--desk-2);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px}
.panel h2{font-size:34px}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.inp:disabled{opacity:.6}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--stamp);flex:none;margin-top:2px}
.switch small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--desk);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 12px;font-family:var(--type);font-size:15px}
.chip .code{color:var(--lamp);font-size:12px}
.chip button{border:0;background:transparent;width:28px;height:28px;border-radius:4px;cursor:pointer;color:var(--muted)}
.chip button:hover{background:var(--line);color:var(--stamp)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .inp{flex:1 1 180px;width:auto}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
details[open] summary{margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--desk);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;transition:transform .12s ease, background .12s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
a.btn{color:var(--text)}
.btn:hover{transform:translateY(-1px);background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.big{font-family:var(--stencil);font-weight:900;font-size:26px;letter-spacing:.06em;text-transform:uppercase;padding:14px 26px;background:var(--stamp);border-color:transparent;color:#fff}
.btn.big:hover{background:#e0414b}
.btn.wa{background:#1f8f55;border-color:transparent;color:#fff}
.btn.wa:hover{background:#25a663}
.btn.sm{padding:8px 12px;font-size:14px}
.msg{color:var(--stamp);font-weight:600;font-size:14px;min-height:1.2em}
.note{color:var(--muted);font-size:14px}

/* Expedientes (carpetas) de la central */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px;padding-top:14px}
.folder{position:relative;background:var(--manila);color:var(--manila-ink);border-radius:0 10px 10px 10px;padding:18px;display:grid;gap:10px;min-width:0;
  box-shadow:0 18px 30px -18px rgba(0,0,0,.8)}
.folder::before{content:attr(data-tab);position:absolute;left:0;top:-22px;height:22px;padding:3px 14px 0;background:var(--manila);border-radius:8px 8px 0 0;
  font-family:var(--type);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.folder .who{font-family:var(--stencil);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase}
.folder .lbl{font-family:var(--type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.folder .url{font-family:var(--type);font-size:11px;background:rgba(0,0,0,.08);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere;max-height:3.6em;overflow:hidden}
.folder .btns{display:flex;gap:8px;flex-wrap:wrap}
.folder .btn{background:rgba(255,255,255,.45);border-color:rgba(0,0,0,.15);color:var(--manila-ink)}
.folder .btn.wa{background:#1f8f55;color:#fff;border-color:transparent}
.folder .sent{position:absolute;right:14px;top:12px;font-family:var(--stencil);font-weight:900;font-size:20px;color:#1f8f55;border:3px solid currentColor;padding:0 8px;transform:rotate(8deg);letter-spacing:.06em}
.progress{height:8px;background:var(--desk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok);transition:width .4s}

/* Día D */
.order{display:grid;gap:8px;counter-reset:o;margin:0;padding:0;list-style:none}
.order li{counter-increment:o;display:flex;gap:12px;align-items:center;background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--type);font-size:18px;
  animation:in .35s both}
.order li::before{content:counter(o);font-family:var(--stencil);font-weight:900;color:var(--lamp);font-size:26px;width:1.4em;text-align:center}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.rules{display:grid;gap:6px;color:var(--muted);font-size:15px;padding-left:20px;margin:0}

/* Pantalla del agente: verificación por huella */
.gate{display:grid;justify-items:center;text-align:center;gap:20px;padding-block:16px}
.gate h1{font-size:clamp(46px,12vw,96px)}
.gate h1 em{font-style:normal;color:var(--lamp)}
.gate p{color:var(--muted);max-width:40ch}
.finger{--p:0;position:relative;width:150px;height:150px;border-radius:50%;border:0;cursor:pointer;background:var(--desk-2);
  display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:0 0 0 1px var(--line), 0 0 40px -10px rgba(255,200,87,calc(var(--p) * .9))}
.finger::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(var(--lamp) calc(var(--p)*360deg), transparent 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px))}
.finger svg{width:84px;height:84px;color:color-mix(in srgb,var(--lamp) calc(var(--p)*100%), var(--muted))}
.finger.scan svg{animation:scan .9s linear infinite}
@keyframes scan{50%{filter:drop-shadow(0 0 8px var(--lamp))}}
.finger-hint{font-family:var(--type);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* El expediente */
.dossier{position:relative;background:var(--manila);color:var(--manila-ink);border-radius:4px 12px 12px 12px;padding:clamp(18px,5vw,40px);display:grid;gap:22px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9);animation:open .6s cubic-bezier(.2,1.2,.4,1) both;
  background-image:repeating-linear-gradient(180deg, transparent 0 27px, rgba(43,36,22,.08) 27px 28px)}
.dossier::before{content:"EXPEDIENTE Nº " attr(data-num);position:absolute;left:0;top:-26px;height:26px;padding:5px 16px 0;background:var(--manila);border-radius:8px 8px 0 0;
  font-family:var(--type);font-size:12px;letter-spacing:.14em}
@keyframes open{from{opacity:0;transform:translateY(30px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.dossier .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dossier .stamp{font-family:var(--stencil);font-weight:900;color:var(--stamp);border:4px solid var(--stamp);padding:2px 12px;font-size:26px;letter-spacing:.08em;transform:rotate(-6deg);opacity:.85;mix-blend-mode:multiply}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-family:var(--type);font-size:17px}
.kv dt{text-transform:uppercase;letter-spacing:.1em;font-size:13px;opacity:.7;padding-top:3px}
.kv dd{margin:0;min-width:0}
.target{display:grid;gap:8px}
.scratch{position:relative;border-radius:6px;overflow:hidden;min-height:clamp(92px,22vw,150px);display:grid;place-items:center;background:#f4e7c3}
.scratch .name{font-family:var(--stencil);font-weight:900;font-size:clamp(54px,15vw,120px);line-height:1;text-transform:uppercase;color:var(--stamp);padding:10px 16px;text-align:center}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .6s}
.scratch canvas.gone{opacity:0;pointer-events:none}
.scratch-tip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--type);font-size:13px;opacity:.8}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.assigned{position:absolute;right:6%;top:50%;font-family:var(--stencil);font-weight:900;color:#1d7a46;border:5px solid currentColor;padding:0 12px;font-size:clamp(24px,6vw,40px);
  letter-spacing:.08em;transform:translateY(-50%) rotate(-12deg) scale(2.4);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.assigned.on{animation:stamp .45s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes stamp{to{transform:translateY(-50%) rotate(-12deg) scale(1);opacity:.9}}
.mission{border:2px dashed rgba(43,36,22,.4);border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.mission b{font-family:var(--stencil);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--stamp)}
.mission p{font-family:var(--type);font-size:18px}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{background:var(--manila-ink);color:var(--manila);border-radius:6px;padding:8px 10px;min-width:70px;text-align:center}
.count strong{display:block;font-family:var(--stencil);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-family:var(--type);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.self-destruct{justify-self:start}
.dossier .btn{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.2);color:var(--manila-ink)}

/* Bloques extra del agente */
.extra h2{font-size:30px}
.ideas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.idea{background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;animation:in .3s both}
.idea span:last-child{font-family:var(--type);color:var(--lamp);white-space:nowrap;font-variant-numeric:tabular-nums}
textarea.inp{resize:vertical;min-height:52px}

/* Carta de deseos */
.wl{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.wi{background:var(--desk);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0;animation:in .3s both}
.wi .ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--desk-2);display:grid;place-items:center;overflow:hidden}
.wi .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.wi .ph span{font-family:var(--stencil);font-weight:900;font-size:56px;color:var(--line)}
.wi .bd{padding:12px 14px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.wi .t{font-weight:700;overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline}
.wi .t .n{font-family:var(--stencil);font-weight:900;color:var(--lamp);font-size:20px}
.wi .meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--type);font-size:12px;color:var(--muted)}
.wi .meta .pr{color:var(--lamp);font-variant-numeric:tabular-nums}
.wi .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.wi .btn:disabled{opacity:.35;cursor:default;transform:none}
.wempty{grid-column:1/-1;display:grid;gap:4px;border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.wempty b{color:var(--text)}
.wform{display:grid;gap:14px;border:1px solid var(--line);background:var(--desk);border-radius:12px;padding:16px}
.photo-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-pick .inp{flex:1 1 200px;width:auto}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none}
.kv-dark{color:var(--text)}
.kv-dark dt{color:var(--muted)}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.foot{text-align:center;color:var(--muted);font-family:var(--type);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.shuffle{font-family:var(--stencil);font-weight:900;font-size:clamp(40px,10vw,80px);text-align:center;color:var(--lamp);text-transform:uppercase;min-height:1.1em}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" hidden></canvas>
<main class="wrap" id="app"></main>

<script>
"use strict";
// ================== Configuración ==================
const DEFAULT = {
  event:"Amigo Invisible 2026", budget:"20", date:"2026-12-24",
  people:["Angel","Itziar","Carlos","Miguel","Jesús","Vari"], excl:[], missions:true
};
const KEY = "operacion-amigo-invisible-v2";
const BASE = location.href.split("#")[0];

const MISSIONS = [
  "El regalo tiene que llevar algo de color rojo.",
  "Envuélvelo con papel de periódico.",
  "Mete dentro una nota escrita a mano con un recuerdo vuestro.",
  "Una parte del regalo tiene que estar hecha por ti.",
  "Tiene que incluir algo que se pueda comer.",
  "Mete el regalo dentro de otra caja que despiste.",
  "Escribe la tarjeta en verso, con rima.",
  "Que lleve algo de Casarabonela o de Málaga.",
  "El envoltorio tiene que ser lo más ridículo posible.",
  "Que tenga que ver con una canción que le guste.",
  "Incluye algo que le recuerde a cuando erais pequeños.",
  "Firma la tarjeta con un nombre en clave, nunca con el tuyo.",
  "Que se pueda usar todos los días.",
  "Escóndele una pista falsa para que crea que eres otro."
];
const INITIAL_MISSION = "Algo del regalo tiene que empezar por la letra «%L»."; // se añade con la inicial del objetivo

const IDEAS = [
  ["Calcetines absurdos a juego con su personalidad",7],["Bolsa de chuches de cuando erais pequeños",8],
  ["Entrada de cine para la peli que espera",9],["Suculenta con maceta pintada por ti",10],
  ["Libro de bolsillo de su autor favorito",11],["Taza con una foto vergonzosa del grupo",12],
  ["Juego de cartas rápido (Dobble, Virus!)",13],["Pack de cervezas artesanas raras",14],
  ["Botella térmica de acero",15],["Funko de su serie favorita",15],
  ["Lámpara de luna o de nubes",17],["Camiseta con una frase mítica del grupo",18],
  ["Batería externa para el móvil",18],["Puzzle de 500 piezas con una foto vuestra",20],
  ["Manta de sofá gordita",20],["Altavoz bluetooth pequeño",22],
  ["Kit para hacer cócteles en casa",25],["Juego de mesa (Exploding Kittens, Código Secreto)",25],
  ["Sudadera de su equipo o grupo favorito",30],["Experiencia: escape room para dos",40],
  ["Auriculares inalámbricos sencillos",30],["Vale casero: una cena cocinada por ti",0],
  ["Mini proyector de estrellas",20],["Cuaderno bonito y un boli de los buenos",12]
];

// ================== Utilidades ==================
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = n => { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} }
};
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const code = name => { let h=7; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return "AG-"+String(h%900+100) };

// Ofuscación del enlace (para no hacer trampas sin querer; no es criptografía)
const SALT = new TextEncoder().encode("casarabonela-regalo-2026");
function encode(o){
  const b = new TextEncoder().encode(JSON.stringify(o)).map((x,i)=>x ^ SALT[i%SALT.length] ^ (i*31&255));
  let s=""; b.forEach(x=>s+=String.fromCharCode(x));
  return "r"+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decode(t){
  try{
    if(!t||t[0]!=="r") return null;
    let s=t.slice(1).replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
    const bin=atob(s), b=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i) ^ SALT[i%SALT.length] ^ (i*31&255);
    const o=JSON.parse(new TextDecoder().decode(b));
    return o&&o.g&&o.r ? o : null;
  }catch{ return null }
}

// Sorteo: nadie se toca a sí mismo y se respetan las parejas vetadas
function draw(people, excl){
  const ban=new Set(); excl.forEach(([a,b])=>{ban.add(a+"|"+b);ban.add(b+"|"+a)});
  for(let t=0;t<5000;t++){
    const r=shuffle(people);
    if(people.every((g,i)=>g!==r[i]&&!ban.has(g+"|"+r[i]))) return people.map((g,i)=>[g,r[i]]);
  }
  return null;
}
const fmtDate = iso => { const d=new Date(iso+"T12:00:00"); return isNaN(d)?iso:d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) };
const msgFor = (g,url,ev) => `🕵️ ${ev}\nAgente ${g}: tienes un expediente clasificado.\nÁbrelo tú solo, sin nadie mirando:\n${url}`;

// ================== Estado de la central ==================
let S = store.get(KEY) || {...DEFAULT, people:[...DEFAULT.people], excl:[], links:null, sent:{}, order:null};
const save = () => store.set(KEY,S);

// ================== Central de operaciones ==================
function renderHQ(){
  const done=!!S.links;
  const isFile = location.protocol==="file:";
  $("#app").innerHTML = `

function bindHQ(){
  const sync=()=>{ const ev=$("#ev"); if(!ev||ev.disabled) return;
    S.event=ev.value.trim()||DEFAULT.event; S.budget=$("#bu").value.trim(); S.date=$("#da").value; S.missions=$("#mi").checked; save() };
  ["#ev","#bu","#da","#mi"].forEach(id=>{ const el=$(id); el&&el.addEventListener("input",sync); el&&el.addEventListener("change",sync) });
  $$("[data-del]").forEach(b=>b.onclick=()=>{ const n=S.people[+b.dataset.del]; S.people.splice(+b.dataset.del,1);
    S.excl=S.excl.filter(([a,c])=>a!==n&&c!==n); save(); renderHQ() });
  $$("[data-dx]").forEach(b=>b.onclick=()=>{ S.excl.splice(+b.dataset.dx,1); save(); renderHQ() });
  const f=$("#addf"); if(f) f.onsubmit=e=>{ e.preventDefault(); const v=$("#newp").value.trim(); if(!v) return;
    if(!S.people.some(p=>p.toLowerCase()===v.toLowerCase())) S.people.push(v); save(); renderHQ(); $("#newp").focus() };
  const xa=$("#xadd"); if(xa) xa.onclick=()=>{ const a=$("#xa").value,b=$("#xb").value;
    if(a!==b&&!S.excl.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))){ S.excl.push([a,b]); save(); renderHQ() } };
  const go=$("#go"); if(go) go.onclick=()=>{
    sync();
    if(S.people.length<3) return $("#msg").textContent="Hacen falta al menos 3 agentes.";
    const pairs=draw(S.people,S.excl);
    if(!pairs) return $("#msg").textContent="Con esas parejas vetadas no sale ningún reparto. Quita alguna.";
    const ms=shuffle(MISSIONS);
    S.links=pairs.map(([g,r],i)=>{
      let m=null;
      if(S.missions) m = (i===0 && rnd(2)) ? INITIAL_MISSION.replace("%L",r[0].toUpperCase()) : ms[i%ms.length];
      return {g, tok:encode({g,r,e:S.event,b:S.budget,d:S.date,m})};
    });
    S.sent={}; S.order=null; save();
    go.disabled=true;
    const box=$("#shuf"), names=S.people; let k=0; box.hidden=false;
    if(reduced()){ renderHQ(); return }
    const iv=setInterval(()=>{ box.textContent="Cifrando · "+names[k++%names.length] },70);
    setTimeout(()=>{ clearInterval(iv); renderHQ(); shreds(1400) },1300);
  };
  $$("[data-copy]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.copy, l=S.links.find(x=>x.g===g), text=msgFor(g,BASE+"#"+l.tok,S.event);
    const ok=()=>{ b.textContent="¡Copiado!"; S.sent[g]=1; save(); setTimeout(renderHQ,900) };
    const fail=()=>{ const u=b.closest(".folder").querySelector(".url"), r=document.createRange(); r.selectNodeContents(u);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Cópialo a mano" };
    try{ navigator.clipboard.writeText(text).then(ok,fail) }catch{ fail() }
  });
  $$("[data-wa]").forEach(a=>a.addEventListener("click",()=>{ S.sent[a.dataset.wa]=1; save(); setTimeout(renderHQ,500) }));
  const redo=$("#redo"); if(redo) redo.onclick=()=>$("#confirm").hidden=false;
  const no=$("#no"); if(no) no.onclick=()=>$("#confirm").hidden=true;
  const yes=$("#yes"); if(yes) yes.onclick=()=>{ S.links=null; S.sent={}; S.order=null; save(); renderHQ() };
  const ord=$("#order"); if(ord) ord.onclick=()=>{ S.order=shuffle(S.people); save(); renderHQ(); $("#h-dd").scrollIntoView({behavior:reduced()?"auto":"smooth"}) };
}

  const stop=()=>{ if(!held) return; held=false; cancelAnimationFrame(raf); fp.classList.remove("scan"); fp.style.setProperty("--p",0); hint.textContent="Sin soltar, hasta que se llene" };
  fp.addEventListener("pointerdown",start); ["pointerup","pointerleave","pointercancel"].forEach(ev=>fp.addEventListener(ev,stop));
  fp.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat) start(e) });

  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top] };
  const scratch=(a,b)=>{ ctx.globalCompositeOperation="destination-out"; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=38;

  cv.addEventListener("pointermove",e=>{ if(!last||revealed) return; const p=pos(e); scratch(last,p); last=p; if(++moves%12===0&&cleared()>.5) reveal() });
  const up=()=>{ last=null; if(!revealed&&cleared()>.5) reveal() };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);

// ================== Carta de deseos ==================
const safeUrl = u => { u=String(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u;
  try{ const x=new URL(u); return /^https?:$/.test(x.protocol)&&x.hostname.includes(".") ? x.href : "" }catch{ return "" } };
const safeImg = s => /^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(s||"") ? s : safeUrl(s);
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,"") }catch{ return "" } };

function b64u(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"") }
function unb64u(t){ let s=t.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const b=atob(s), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u }
async function packCarta(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "w"+b64u(new Uint8Array(await new Response(st).arrayBuffer())) }catch{}
  }
  return "x"+b64u(bytes);
}
async function unpackCarta(t){
  try{
    let bytes=unb64u(t.slice(1));
    if(t[0]==="w"){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); bytes=new Uint8Array(await new Response(st).arrayBuffer()) }
    const c=JSON.parse(new TextDecoder().decode(bytes));
    if(!c||!c.n||!Array.isArray(c.it)) return null;
    c.it=c.it.slice(0,20).map(x=>({t:String(x.t||"").slice(0,80),u:safeUrl(x.u),p:String(x.p||"").slice(0,8),n:String(x.n||"").slice(0,120),i:safeImg(x.i)})).filter(x=>x.t);
    c.f=c.f||{}; return c;
  }catch{ return null }
}
// Reduce la foto a una miniatura para que quepa en el enlace
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); await new Promise((ok,ko)=>{ img.onload=ok; img.onerror=ko; img.src=url });
    const k=Math.min(1,200/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    let d=c.toDataURL("image/webp",.55); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/jpeg",.6);
    return d;
  } finally { URL.revokeObjectURL(url) }
}

function itemCard(x,i,edit){
  return `<article class="wi">
    <div class="ph">${x.i?`<img src="${esc(x.i)}" alt="${esc(x.t)}" loading="lazy">`:""}<span>${esc((x.t||"?")[0].toUpperCase())}</span></div>
    <div class="bd">
      <span class="t"><span class="n">${i+1}</span>${esc(x.t)}</span>
      <div class="meta">${x.p?`<span class="pr">~${esc(x.p)} €</span>`:""}${x.u?`<span>${esc(host(x.u))}</span>`:""}</div>
      ${x.n?`<p class="note">${esc(x.n)}</p>`:""}
      <div class="acts">
        ${x.u?`<a class="btn sm" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">Ver en la tienda</a>`:""}
        ${edit?`<button class="btn sm" type="button" data-up="${i}" ${i?"":"disabled"} aria-label="Subir prioridad">▲</button>
          <button class="btn sm" type="button" data-ed="${i}">Editar</button>
          <button class="btn sm" type="button" data-rm="${i}">Quitar</button>`:""}
      </div>
    </div>
  </article>`;
}
const fixImgs = root => $$(".ph img",root).forEach(im=>{ const f=()=>im.remove(); im.complete&&!im.naturalWidth&&im.src ? f() : im.addEventListener("error",f) });

function cartaText(c,url){
  let t=`🎁 Carta de deseos de ${c.n}\n`;
  c.it.forEach((x,i)=>{ t+=`\n${i+1}. ${x.t}${x.p?` (~${x.p} €)`:""}`; if(x.n) t+=`\n   ${x.n}`; if(x.u) t+=`\n   ${x.u}` });
  const f=c.f||{};
  if(f.w1||f.w2||f.w3||f.w4) t+="\n";
  if(f.w1) t+=`\n• Me flipa: ${f.w1}`; if(f.w2) t+=`\n• Me haría ilusión algo de: ${f.w2}`;
  if(f.w3) t+=`\n• Ni se te ocurra: ${f.w3}`; if(f.w4) t+=`\n• Talla: ${f.w4}`;
  t+= url ? `\n\n📸 Con fotos: ${url}` : `\n\n📸 La carta con fotos te la paso aparte.`;
  return t;
}

function bindCarta(o, oldFicha){
  const key="carta-"+o.g;
  const C=store.get(key)||{f:{w1:oldFicha.w1||"",w2:oldFicha.w2||"",w3:oldFicha.w3||"",w4:oldFicha.w4||""},it:[]};
  let editing=-1, img="", seq=0, link="";
  ["w1","w2","w3","w4"].forEach(k=>{ const el=$("#"+k); el.value=C.f[k]||""; el.addEventListener("input",()=>{ C.f[k]=el.value.trim(); persist() }) });

  const persist=()=>{ store.set(key,C); share() };
  const share=async()=>{
    const my=++seq;
    const tok=await packCarta({n:o.g,e:o.e,f:C.f,it:C.it});
    if(my!==seq) return;
    link=BASE+"#"+tok;
    const empty=!C.it.length&&!Object.values(C.f).some(Boolean);
    let wa="https://wa.me/?text="+encodeURIComponent(cartaText({n:o.g,f:C.f,it:C.it},link));
    const long = wa.length>6000;
    if(long) wa="https://wa.me/?text="+encodeURIComponent(cartaText({n:o.g,f:C.f,it:C.it},""));
    const a=$("#wsend"); a.href=wa; a.toggleAttribute("aria-disabled",empty); a.style.opacity=empty?.5:1; a.style.pointerEvents=empty?"none":"";
    $("#wview").href=link;
    const hasPhoto=C.it.some(x=>x.i&&x.i.startsWith("data:"));
    $("#wsize").textContent = long
      ? "Tu carta lleva muchas fotos subidas y el enlace es muy largo para meterlo en el WhatsApp. Manda primero la lista y luego pega el enlace con «Copiar enlace»."
      : hasPhoto ? "Las fotos subidas van dentro del enlace en miniatura. Si añades muchas, el enlace se hace muy largo."
      : "Truco: si pegas el enlace de Amazon o de otra tienda, WhatsApp ya enseña la foto del producto.";
  };

  const draw=()=>{
    const wl=$("#wl");
    wl.innerHTML = C.it.length ? C.it.map((x,i)=>itemCard(x,i,true)).join("")
      : `<div class="wempty"><b>Tu carta está vacía</b><span>Añade abajo lo primero que te gustaría recibir.</span></div>`;
    fixImgs(wl);
    $$("[data-rm]",wl).forEach(b=>b.onclick=()=>{ C.it.splice(+b.dataset.rm,1); if(editing>=0) resetForm(); persist(); draw() });
    $$("[data-up]",wl).forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [C.it[i-1],C.it[i]]=[C.it[i],C.it[i-1]]; persist(); draw() });
    $$("[data-ed]",wl).forEach(b=>b.onclick=()=>{ const i=+b.dataset.ed, x=C.it[i]; editing=i;
      $("#wt").value=x.t; $("#wu").value=x.u; $("#wp").value=x.p; $("#wn").value=x.n; setImg(x.i);
      $("#wiu").value = x.i&&!x.i.startsWith("data:") ? x.i : "";
      $("#wfh").textContent="Editando el deseo "+(i+1); $("#wsave").textContent="Guardar cambios"; $("#wcancel").hidden=false;
      $("#wf").scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"}); $("#wt").focus() });
  };
  const setImg=v=>{ img=v||""; const th=$("#wthumb"); th.hidden=!img; if(img) th.src=img; else th.removeAttribute("src"); $("#wclr").hidden=!img };
  const resetForm=()=>{ editing=-1; $("#wf").reset(); setImg(""); $("#wfh").textContent="Añadir un deseo"; $("#wsave").textContent="Añadir a mi carta"; $("#wcancel").hidden=true; $("#wmsg").textContent="" };

  $("#wthumb").addEventListener("error",()=>{ if(img&&!img.startsWith("data:")){ $("#wmsg").textContent="Esa imagen no se puede cargar. Prueba con otra o súbela."; setImg("") } });
  $("#wpick").onclick=()=>$("#wfile").click();
  $("#wfile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    $("#wmsg").textContent="Preparando foto…";
    try{ setImg(await shrink(f)); $("#wiu").value=""; $("#wmsg").textContent="" }catch{ $("#wmsg").textContent="No se pudo leer esa foto. Prueba con otra." }
    e.target.value="" };
  $("#wiu").addEventListener("input",e=>{ const u=safeUrl(e.target.value); if(u||!e.target.value) { $("#wmsg").textContent=""; setImg(u) } });
  $("#wclr").onclick=()=>{ setImg(""); $("#wiu").value="" };
  $("#wcancel").onclick=resetForm;
  $("#wf").onsubmit=e=>{
    e.preventDefault();
    const t=$("#wt").value.trim(); if(!t){ $("#wmsg").textContent="Pon al menos qué es."; $("#wt").focus(); return }
    const raw=$("#wu").value.trim(), u=safeUrl(raw);
    if(raw&&!u){ $("#wmsg").textContent="Ese enlace no parece una web. Cópialo entero desde la tienda."; $("#wu").focus(); return }
    if(editing<0 && C.it.length>=20){ $("#wmsg").textContent="Máximo 20 deseos. ¡No te pases!"; return }
    const x={t,u,p:$("#wp").value.trim().replace(/[^\d.,]/g,""),n:$("#wn").value.trim(),i:img};
    if(editing>=0) C.it[editing]=x; else C.it.push(x);
    resetForm(); persist(); draw();
    $("#wmsg").textContent="Guardado en tu carta.";
  };
  $("#wcopy").onclick=()=>{ const b=$("#wcopy");
    const ok=()=>{ b.textContent="¡Copiado!"; setTimeout(()=>b.textContent="Copiar enlace",1500) };
    const fail=()=>{ $("#wsize").textContent=link; const r=document.createRange(); r.selectNodeContents($("#wsize")); const s=getSelection(); s.removeAllRanges(); s.addRange(r) };
    try{ navigator.clipboard.writeText(link).then(ok,fail) }catch{ fail() } };
  draw(); share();
}

  const f=c.f||{};
  $("#app").innerHTML=`
  <div class="strip"><span>Información del objetivo</span><span>Carta de deseos</span><span>${esc(code(c.n))}</span></div>

    ${f.w3?`<dt>Ni se te ocurra</dt><dd>${esc(f.w3)}</dd>`:""}${f.w4?`<dt>Talla</dt><dd>${esc(f.w4)}</dd>`:""}</dl></section>`:""}

function showIdeas(budget){
  const pool=IDEAS.filter(([,p])=>budget==null||p<=budget);
  $("#ideas").innerHTML=shuffle(pool).slice(0,6).map(([t,p])=>`<div class="idea"><span>${esc(t)}</span><span>${p?"~"+p+" €":"gratis"}</span></div>`).join("");
}

function startCountdown(iso){
  const el=$("#cd"); if(!el||!iso) return;
  const target=new Date(iso+"T00:00:00").getTime();
  const f=()=>{ let s=Math.max(0,Math.floor((target-Date.now())/1000));
    if(s===0){ el.innerHTML=`<div><strong>¡Hoy!</strong><span>Día D</span></div>`; return }
    const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
    el.innerHTML=[[d,"días"],[h,"horas"],[m,"min"],[s,"seg"]].map(([v,l])=>`<div><strong>${String(v).padStart(2,"0")}</strong><span>${l}</span></div>`).join("") };
  f(); clearInterval(window.__cd); window.__cd=setInterval(f,1000);
}

function renderBroken(){
  $("#app").innerHTML=`<div class="strip"><span>Error</span><span>Expediente dañado</span><span>—</span></div>
  <section class="gate"><h1>Expediente<br><em>dañado</em></h1>
  <p>Este enlace llegó cortado o mal copiado. Pide a la central que te lo reenvíe entero.</p></section>`;
}

// ================== Papel triturado (confeti) ==================
function shreds(ms){
  if(reduced()) return;
  const c=$("#fx"); c.hidden=false; const ctx=c.getContext("2d"), d=devicePixelRatio||1;
  c.width=innerWidth*d; c.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0);
  const cols=["#e2cc98","#d3b979","#d2323c","#f4e7c3","#ffc857"];
  const P=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:Math.random()*3+2,
    w:Math.random()*4+3,h:Math.random()*16+10,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:cols[rnd(cols.length)],ph:Math.random()*6}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.ph+=.08; p.x+=p.vx+Math.sin(p.ph)*1.2; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(Math.cos(p.ph),1); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore() });
    if(t-t0<ms) requestAnimationFrame(f); else { ctx.clearRect(0,0,innerWidth,innerHeight); c.hidden=true }
  })(t0);
}

// ================== Arranque ==================
function route(){
  clearInterval(window.__cd);
  const h=location.hash.slice(1);
  if(!h) return renderHQ();
  if(h[0]==="w"||h[0]==="x"){ unpackCarta(h).then(c=>c?renderCarta(c):renderBroken()); scrollTo(0,0); return }
  const o=decode(h); o?renderGate(o):renderBroken();
  scrollTo(0,0);
}
addEventListener("hashchange",route);
route();
