<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Operación Amigo Invisible</title>
<meta name="description" content="Apúntate, escribe tu carta de deseos y descubre a quién le haces el regalo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Special+Elite&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='40' rx='4' fill='%23e2cc98'/%3E%3Cpath d='M6 18h20l4 6h28' fill='none' stroke='%238a6d34' stroke-width='3'/%3E%3Crect x='14' y='32' width='36' height='8' fill='%23111'/%3E%3C/svg%3E">
<style>
/* Concepto: mesa de operaciones de noche. Cada agente se registra con su PIN y deja su carta;
   la central sortea; cada uno abre su expediente con la huella y rasca para ver su objetivo.
   Un solo tema oscuro a propósito: es una operación nocturna. */
:root{
  color-scheme:dark;
  --desk:#0f1720; --desk-2:#16212d; --desk-3:#1d2b3a;
  --manila:#e2cc98; --manila-ink:#2b2416;
  --stamp:#d2323c; --lamp:#ffc857;
  --text:#e9edf2; --muted:#93a1b1; --line:#2a3a4b; --ok:#57c785;
  --stencil:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;
  --type:"Special Elite","Courier New",Courier,monospace;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--desk)}
body{margin:0;min-height:100%;color:var(--text);font:16px/1.5 var(--ui);
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%, rgba(255,200,87,.16), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.025) 31px 32px),
    repeating-linear-gradient(90deg, transparent 0 31px, rgba(255,255,255,.025) 31px 32px),
    var(--desk);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:grid;gap:26px}
h1,h2,h3{margin:0;font-family:var(--stencil);font-weight:900;line-height:.95;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
.label{font-family:var(--type);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:14px}
.msg{color:var(--stamp);font-weight:600;font-size:14px;min-height:1.2em}
.msg.good{color:var(--ok)}

.strip{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--type);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--stamp);border-block:1px dashed rgba(210,50,60,.45);padding-block:6px}
.hero{display:grid;gap:12px}
.hero h1{font-size:clamp(52px,13vw,120px)}
.hero h1 em{font-style:normal;color:var(--lamp);display:block}
.hero p{max-width:58ch;color:var(--muted)}

.panel{background:var(--desk-2);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px;min-width:0}
.panel h2{font-size:32px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:52px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .inp{flex:1 1 180px;width:auto}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--stamp);flex:none;margin-top:2px}
.switch small{display:block;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
details[open] summary{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--desk);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 12px;font-family:var(--type);font-size:15px}
.chip button{border:0;background:transparent;width:28px;height:28px;border-radius:4px;cursor:pointer;color:var(--muted)}
.chip button:hover{background:var(--line);color:var(--stamp)}

.btn{border:1px solid var(--line);background:var(--desk);color:var(--text);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;
  transition:transform .12s ease, background .12s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-1px);background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.big{font-family:var(--stencil);font-weight:900;font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:13px 24px;background:var(--stamp);border-color:transparent;color:#fff}
.btn.big:hover:not(:disabled){background:#e0414b}
.btn.wa{background:#1f8f55;border-color:transparent;color:#fff}
.btn.wa:hover{background:#25a663}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{background:var(--stamp);border-color:transparent;color:#fff}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}

/* Tablero de agentes */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 12px;padding-top:12px}
.agent{position:relative;display:grid;gap:4px;text-align:left;background:var(--manila);color:var(--manila-ink);border:0;border-radius:0 10px 10px 10px;
  padding:16px 14px 14px;cursor:pointer;box-shadow:0 14px 24px -16px rgba(0,0,0,.8);transition:transform .15s}
.agent::before{content:"";position:absolute;left:0;top:-12px;width:46%;height:12px;background:var(--manila);border-radius:6px 6px 0 0}
.agent:hover{transform:translateY(-3px) rotate(-.6deg)}
.agent .nm{font-family:var(--stencil);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.agent .st{font-family:var(--type);font-size:12px;letter-spacing:.06em}
.agent .seal{position:absolute;right:10px;top:8px;font-family:var(--stencil);font-weight:900;font-size:13px;letter-spacing:.06em;border:2px solid currentColor;padding:0 6px;transform:rotate(8deg)}
.agent.done .seal{color:#1d7a46}
.agent.wait .seal{color:var(--stamp)}
.progress{height:8px;background:var(--desk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok);transition:width .4s}
.phase{display:flex;gap:14px;align-items:flex-start;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;flex-wrap:wrap}
.phase b:first-child{font-family:var(--stencil);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--lamp);white-space:nowrap}
.phase span{flex:1 1 220px;min-width:0}

/* PIN */
.pinbox{display:grid;gap:14px;width:100%;max-width:420px}
.pin{font-family:var(--stencil);font-weight:900;font-size:40px;letter-spacing:.5em;text-align:center;padding:10px 0 10px .5em}
.center{display:grid;justify-items:center;text-align:center;gap:16px}

/* Pestañas del agente */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--stencil);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--lamp)}
.save{font-family:var(--type);font-size:13px;color:var(--muted)}
.save.ok{color:var(--ok)} .save.bad{color:var(--stamp)}

/* Huella */
.finger{--p:0;position:relative;width:150px;height:150px;border-radius:50%;border:0;cursor:pointer;background:var(--desk-2);
  display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:0 0 0 1px var(--line), 0 0 40px -10px rgba(255,200,87,calc(var(--p) * .9))}
.finger::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--lamp) calc(var(--p)*360deg), transparent 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px))}
.finger svg{width:84px;height:84px;color:color-mix(in srgb,var(--lamp) calc(var(--p)*100%), var(--muted))}
.finger.scan svg{animation:scan .9s linear infinite}
@keyframes scan{50%{filter:drop-shadow(0 0 8px var(--lamp))}}

/* Expediente */
.dossier{position:relative;margin-top:28px;background:var(--manila);color:var(--manila-ink);border-radius:4px 12px 12px 12px;padding:clamp(18px,5vw,40px);display:grid;gap:22px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9);animation:open .6s cubic-bezier(.2,1.2,.4,1) both;
  background-image:repeating-linear-gradient(180deg, transparent 0 27px, rgba(43,36,22,.08) 27px 28px)}
.dossier::before{content:"EXPEDIENTE Nº " attr(data-num);position:absolute;left:0;top:-26px;height:26px;padding:5px 16px 0;background:var(--manila);border-radius:8px 8px 0 0;font-family:var(--type);font-size:12px;letter-spacing:.14em}
@keyframes open{from{opacity:0;transform:translateY(30px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.dossier .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dossier .stamp{font-family:var(--stencil);font-weight:900;color:var(--stamp);border:4px solid var(--stamp);padding:2px 12px;font-size:26px;letter-spacing:.08em;transform:rotate(-6deg);opacity:.85;mix-blend-mode:multiply}
.dossier > * .label, .dossier > .top .label{color:inherit;opacity:.7}
.dossier .locked .note, .dossier .mission .note{color:inherit;opacity:.75}
.dossier > .btn, .dossier .locked .btn, #hide{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.2);color:var(--manila-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-family:var(--type);font-size:17px}
.kv dt{text-transform:uppercase;letter-spacing:.1em;font-size:13px;opacity:.7;padding-top:3px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.scratch{position:relative;border-radius:6px;overflow:hidden;min-height:clamp(92px,22vw,150px);display:grid;place-items:center;background:#f4e7c3}
.scratch .name{font-family:var(--stencil);font-weight:900;font-size:clamp(50px,14vw,116px);line-height:1;text-transform:uppercase;color:var(--stamp);padding:10px 16px;text-align:center;overflow-wrap:anywhere}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .6s}
.scratch canvas.gone{opacity:0;pointer-events:none}
.scratch-tip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--type);font-size:13px;opacity:.8}
.assigned{position:absolute;right:6%;top:50%;font-family:var(--stencil);font-weight:900;color:#1d7a46;border:5px solid currentColor;padding:0 12px;font-size:clamp(24px,6vw,40px);
  letter-spacing:.08em;transform:translateY(-50%) rotate(-12deg) scale(2.4);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.assigned.on{animation:stamp .45s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes stamp{to{transform:translateY(-50%) rotate(-12deg) scale(1);opacity:.9}}
.mission{border:2px dashed rgba(43,36,22,.4);border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.mission b{font-family:var(--stencil);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--stamp)}
.mission p{font-family:var(--type);font-size:18px}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{background:var(--manila-ink);color:var(--manila);border-radius:6px;padding:8px 10px;min-width:70px;text-align:center}
.count strong{display:block;font-family:var(--stencil);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-family:var(--type);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.locked{display:grid;gap:10px;justify-items:start}

/* Carta de deseos */
.wl{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.wi{background:var(--desk);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0;color:var(--text);animation:in .3s both}
.wi .ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--desk-3);display:grid;place-items:center;overflow:hidden}
.wi .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.wi .ph span{font-family:var(--stencil);font-weight:900;font-size:56px;color:var(--line)}
.wi .bd{padding:12px 14px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.wi .t{font-weight:700;overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline}
.wi .t .n{font-family:var(--stencil);font-weight:900;color:var(--lamp);font-size:20px}
.wi .meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--type);font-size:12px;color:var(--muted)}
.wi .meta .pr{color:var(--lamp);font-variant-numeric:tabular-nums}
.wi .note{color:var(--muted)}
.wi .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.wempty{grid-column:1/-1;display:grid;gap:4px;border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.wempty b{color:var(--text)}
.wform{display:grid;gap:14px;border:1px solid var(--line);background:var(--desk);border-radius:12px;padding:16px}
.photo-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-pick .inp{flex:1 1 200px;width:auto}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none}
.tcarta{display:grid;gap:14px;background:var(--desk-2);border-radius:12px;padding:16px;color:var(--text)}
.tcarta h3{font-size:26px}
.tcarta .label{color:var(--muted);opacity:1}
.tcarta .note{color:var(--muted)}
.tcarta .kv{font-size:15px}
.tcarta .kv dt{color:var(--muted);opacity:1}

/* Ideas, Día D, tabla de la central */
.ideas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.idea{background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;animation:in .3s both}
.idea span:last-child{font-family:var(--type);color:var(--lamp);white-space:nowrap}
.order{display:grid;gap:8px;counter-reset:o;margin:0;padding:0;list-style:none}
.order li{counter-increment:o;display:flex;gap:12px;align-items:center;background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--type);font-size:18px;animation:in .35s both}
.order li::before{content:counter(o);font-family:var(--stencil);font-weight:900;color:var(--lamp);font-size:26px;width:1.4em;text-align:center}
.rules{display:grid;gap:6px;color:var(--muted);font-size:15px;padding-left:20px;margin:0}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;min-width:440px}
.tbl th{text-align:left;font-family:var(--type);font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:nth-child(3){font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.ok{background:rgba(87,199,133,.15);color:var(--ok)}
.pill.no{background:rgba(210,50,60,.15);color:#ff7b82}
.pill.lock{background:rgba(255,200,87,.15);color:var(--lamp)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.foot{text-align:center;color:var(--muted);font-family:var(--type);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.loading{font-family:var(--type);color:var(--muted);text-align:center;padding-block:40px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
// ================== Configuración ==================
const API = "https://amigo-invisible.alvaroggcasarabonela.workers.dev";
const PAGE = location.origin + location.pathname;
const ME_KEY = "ai-me", ADMIN_KEY = "ai-admin";

const IDEAS = [
  ["Calcetines absurdos a juego con su personalidad",7],["Bolsa de chuches de cuando erais pequeños",8],
  ["Entrada de cine para la peli que espera",9],["Suculenta con maceta pintada por ti",10],
  ["Libro de bolsillo de su autor favorito",11],["Taza con una foto vergonzosa del grupo",12],
  ["Juego de cartas rápido (Dobble, Virus!)",13],["Pack de cervezas artesanas raras",14],
  ["Botella térmica de acero",15],["Funko de su serie favorita",15],["Lámpara de luna o de nubes",17],
  ["Camiseta con una frase mítica del grupo",18],["Batería externa para el móvil",18],
  ["Puzzle de 500 piezas con una foto vuestra",20],["Manta de sofá gordita",20],["Mini proyector de estrellas",20],
  ["Altavoz bluetooth pequeño",22],["Kit para hacer cócteles en casa",25],["Juego de mesa (Código Secreto, Exploding Kittens)",25],
  ["Sudadera de su equipo favorito",30],["Escape room para dos",40],["Vale casero: una cena cocinada por ti",0]
];

// ================== Utilidades ==================
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = n => { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch{ return null } },
  set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)) }catch{} }
};
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const code = name => { let h=7; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return "AG-"+String(h%900+100) };
const fmtDate = iso => { const d=new Date(iso+"T12:00:00"); return isNaN(d)?(iso||""):d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}) };
const daysTo = iso => { const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/864e5) };
const safeUrl = u => { u=String(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u;
  try{ const x=new URL(u); return /^https?:$/.test(x.protocol)&&x.hostname.includes(".") ? x.href : "" }catch{ return "" } };
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,"") }catch{ return "" } };
const b64 = buf => { const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s) };
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let timer=null;
const stopTimers = () => { clearInterval(timer); timer=null; clearInterval(window.__cd) };

async function api(path, body, admin){
  const h={}; if(body) h["content-type"]="application/json"; if(admin) h.authorization="Bearer "+admin;
  let r;
  try{ r=await fetch(API+path,{method:body?"POST":"GET",headers:h,body:body?JSON.stringify(body):undefined}) }
  catch{ throw new Error("No hay conexión con la central. Revisa tu internet y vuelve a probar.") }
  let j={}; try{ j=await r.json() }catch{}
  if(!r.ok){ const e=new Error(j.error||"Algo ha fallado ("+r.status+")."); e.status=r.status; throw e }
  return j;
}

// ================== Cifrado (solo tú puedes leer tu resultado) ==================
async function pinKey(pin, salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function makeKeys(pin){
  const kp=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
  const pub=b64(await crypto.subtle.exportKey("spki",kp.publicKey));
  const priv=await crypto.subtle.exportKey("pkcs8",kp.privateKey);
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pinKey(pin,salt),priv);
  return {pub, wrapped:JSON.stringify({s:b64(salt),iv:b64(iv),ct:b64(ct)})};
}
async function openAssignment(wrapped, pin, ct){
  const w=JSON.parse(wrapped);
  const pkcs8=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(w.iv)},await pinKey(pin,unb64(w.s)),unb64(w.ct));
  const key=await crypto.subtle.importKey("pkcs8",pkcs8,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"RSA-OAEP"},key,unb64(ct))));
}

function pinScreen({title, sub, fields, button, onSubmit}){
  stopTimers();
  $("#app").innerHTML=`
  <div class="strip"><span>Control de acceso</span><span>${esc(G?G.cfg.event:"")}</span><span>—</span></div>
  <section class="center">

    <p class="note" style="max-width:44ch">${sub}</p>
    <form class="pinbox" id="pf" autocomplete="off">
      ${fields.map(f=>`<div class="field"><label for="${f.id}">${f.label}</label>
        <input class="inp pin" id="${f.id}" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="off" required></div>`).join("")}
      <button class="btn big" type="submit" id="pbtn">${button}</button>
      <span class="msg" id="pmsg" role="status"></span>
    </form>

  </section>`;

  };
}

function renderRegister(name){
  if(G.drawn) return renderError("El sorteo ya se hizo y no estabas registrado. Habla con el organizador.", renderHome);
  pinScreen({
    title:`Hola,<br><span style="color:var(--lamp)">${esc(name)}</span>`,
    sub:"Crea tu PIN secreto. Lo necesitarás para editar tu carta y para ver a quién te toca. <b>Apúntalo</b>: si lo olvidas después del sorteo no se puede recuperar.",
    fields:[{id:"p1",label:"Tu PIN (4 a 6 números)"},{id:"p2",label:"Repite el PIN"}],
    button:"Crear mi PIN",
    onSubmit: async([a,b])=>{
      if(a!==b) throw new Error("Los dos PIN no coinciden.");
      $("#pmsg").textContent="Generando tus claves secretas…";
      const k=await makeKeys(a);
      await api("/api/claim",{name,pin:a,pub:k.pub,wrapped:k.wrapped});
      await enterAgent(name,a);
    }
  });
}
function renderLogin(name){
  pinScreen({
    title:`Agente<br><span style="color:var(--lamp)">${esc(name)}</span>`,
    sub:"Introduce tu PIN para entrar.",
    fields:[{id:"p1",label:"Tu PIN"}], button:"Entrar",
    onSubmit: async([a])=>enterAgent(name,a)
  });
}

const fixImgs = root => $$(".ph img",root).forEach(im=>{ const f=()=>im.remove(); if(im.complete&&!im.naturalWidth) f(); else im.addEventListener("error",f) });

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); await new Promise((ok,ko)=>{ img.onload=ok; img.onerror=ko; img.src=url });
    const k=Math.min(1,360/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    let d=c.toDataURL("image/webp",.6); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/jpeg",.65);
    return d;
  } finally { URL.revokeObjectURL(url) }
}

    <details ${Object.values(C.f).some(Boolean)?"open":""}>
      <summary>Más pistas para tu amigo invisible</summary>

  const persist=()=>{ ME.data.carta=C; sv.className="save"; sv.textContent="Guardando…"; clearTimeout(saveT);
    saveT=setTimeout(()=>{ saving=saving.then(async()=>{
      try{ await api("/api/carta",{name:ME.name,pin:ME.pin,carta:C}); if(sv.isConnected){ sv.className="save ok"; sv.textContent="Guardada ✓" } }

    resetForm(); persist(); draw(); m.className="msg good"; m.textContent="Añadido.";
  };

  const d=ME.data;

        <button class="btn sm" id="goC">Ir a mi carta</button>
      </div>
    </article>`;
    $("#goC").onclick=()=>renderAgent("carta");
    return;
  }
  $("#pane").innerHTML=`
  <section class="center" style="padding-block:10px">
    <p class="note" style="max-width:40ch">Tienes un expediente clasificado. Comprueba que nadie mira la pantalla y verifica tu identidad.</p>
    <button class="finger" id="fp" aria-label="Mantén pulsado para verificar tu identidad">${FP_SVG}</button>
    <span class="label" id="fph">Mantén el dedo encima</span>
  </section>`;
  const fp=$("#fp"), hint=$("#fph"); let t0=0, raf=0, held=false;
  const NEED=reduced()?300:1400;
  const tick=t=>{ if(!held) return; const p=Math.min(1,(t-t0)/NEED); fp.style.setProperty("--p",p);
    if(p>=1){ held=false; hint.textContent="Descifrando…"; navigator.vibrate&&navigator.vibrate(60); openDossier(); return }
    raf=requestAnimationFrame(tick) };
  const start=e=>{ e.preventDefault(); if(held) return; held=true; t0=performance.now(); fp.classList.add("scan"); hint.textContent="Escaneando…"; raf=requestAnimationFrame(tick) };
  const stop=()=>{ if(!held) return; held=false; cancelAnimationFrame(raf); fp.classList.remove("scan"); fp.style.setProperty("--p",0); hint.textContent="Sin soltar, hasta que se llene" };
  fp.addEventListener("pointerdown",start); ["pointerup","pointerleave","pointercancel"].forEach(ev=>fp.addEventListener(ev,stop));
  fp.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat) start(e) });
  fp.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") stop() });
  fp.addEventListener("contextmenu",e=>e.preventDefault());
}

      <div class="scratch" id="sc"><span class="name">${esc(a.r)}</span><canvas id="scc" aria-hidden="true"></canvas><span class="assigned" id="as">Asignado</span></div>
      <div class="scratch-tip"><span id="tip">Rasca la franja tachada con el dedo</span><button class="linkbtn" type="button" id="skip">Revelar sin rascar</button></div>
    </div>
    <div id="post" hidden style="display:grid;gap:22px">
      ${a.m?`<div class="mission"><b>Misión secreta</b><p>${esc(a.m)}</p><span class="note">El día del intercambio el grupo votará si la has cumplido.</span></div>`:""}
      <div style="display:grid;gap:8px"><span class="label">Cuenta atrás para el Día D</span><div class="count" id="cd"></div></div>
      <div class="tcarta">
        <div class="head"><h3>La carta de ${esc(a.r)}</h3><span class="label">${tc.it.length} ${tc.it.length===1?"deseo":"deseos"}</span></div>
        ${tc.it.length?`<div class="wl">${tc.it.map((x,i)=>itemCard(x,i,false)).join("")}</div>`:`<p class="note">No ha puesto nada en su carta. Tira de las ideas de abajo o de lo que sabes de ${esc(a.r)}.</p>`}
        ${hasF?`<dl class="kv">${f.w1?`<dt>Le flipa</dt><dd>${esc(f.w1)}</dd>`:""}${f.w2?`<dt>Le haría ilusión</dt><dd>${esc(f.w2)}</dd>`:""}${f.w3?`<dt>Ni se te ocurra</dt><dd>${esc(f.w3)}</dd>`:""}${f.w4?`<dt>Talla</dt><dd>${esc(f.w4)}</dd>`:""}</dl>`:""}
      </div>
      <button class="btn sm" type="button" id="hide" style="justify-self:start">Tapar el expediente</button>
    </div>
  </article>
  <section class="panel" id="extras" hidden aria-labelledby="h-id">
    <div class="head"><h2 id="h-id">Material de apoyo</h2><span class="label">${budget!=null?"hasta "+esc(d.cfg.budget)+" €":"ideas"}</span></div>
    <p class="note">Más ideas por si su carta se te queda corta. Precios aproximados.</p>
    <div class="ideas" id="ideas"></div>
    <div class="row"><button class="btn sm" type="button" id="more">Otras ideas</button></div>
  </section>`;
  fixImgs($("#pane"));

  const wrap=$("#sc"), cv=$("#scc"), ctx=cv.getContext("2d");
  let revealed=false, moves=0, last=null;
  const paint=()=>{
    const r=wrap.getBoundingClientRect(), dp=devicePixelRatio||1;
    cv.width=r.width*dp; cv.height=r.height*dp; ctx.setTransform(dp,0,0,dp,0,0);
    ctx.globalCompositeOperation="source-over"; ctx.fillStyle="#0b0b0d"; ctx.fillRect(0,0,r.width,r.height);
    ctx.fillStyle="rgba(255,255,255,.07)"; ctx.font="700 16px 'Special Elite', monospace";
    for(let y=18;y<r.height+20;y+=26) for(let x=(y/26%2)*-60;x<r.width;x+=130) ctx.fillText("CLASIFICADO",x,y);
    ctx.fillStyle="rgba(210,50,60,.9)"; ctx.font="900 20px 'Big Shoulders Stencil Display', Impact, sans-serif";
    ctx.textAlign="center"; ctx.fillText("▼ RASCA AQUÍ ▼", r.width/2, r.height/2+7); ctx.textAlign="start";
  };
  paint(); document.fonts&&document.fonts.ready.then(()=>{ if(!revealed&&moves===0) paint() });
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top] };
  const scratch=(p,q)=>{ ctx.globalCompositeOperation="destination-out"; ctx.lineCap="round"; ctx.lineWidth=38; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke() };
  const cleared=()=>{ const px=ctx.getImageData(0,0,cv.width,cv.height).data; let c=0,n=0; for(let i=3;i<px.length;i+=160){ n++; if(px[i]===0) c++ } return c/n };
  const reveal=()=>{
    if(revealed) return; revealed=true;
    cv.classList.add("gone"); $("#tip").textContent="Objetivo confirmado"; $("#skip").hidden=true;
    setTimeout(()=>{ $("#as").classList.add("on"); navigator.vibrate&&navigator.vibrate([40,40,80]); shreds(2200) },reduced()?0:350);
    setTimeout(()=>{ $("#post").hidden=false; $("#extras").hidden=false; startCountdown(d.cfg.date); showIdeas(budget) },reduced()?0:900);
  };
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); last=pos(e); scratch(last,[last[0]+.1,last[1]]) });
  cv.addEventListener("pointermove",e=>{ if(!last||revealed) return; const p=pos(e); scratch(last,p); last=p; if(++moves%12===0&&cleared()>.5) reveal() });
  const up=()=>{ last=null; if(!revealed&&cleared()>.5) reveal() };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  $("#skip").onclick=reveal;
  $("#hide").onclick=()=>renderAgent("obj");
  $("#more").onclick=()=>showIdeas(budget);
}

function showIdeas(budget){
  const pool=IDEAS.filter(([,p])=>budget==null||p<=budget);
  $("#ideas").innerHTML=shuffle(pool).slice(0,6).map(([t,p])=>`<div class="idea"><span>${esc(t)}</span><span>${p?"~"+p+" €":"gratis"}</span></div>`).join("");
}
function startCountdown(iso){
  const el=$("#cd"); if(!el||!iso) return;
  const target=new Date(iso+"T00:00:00").getTime();
  const f=()=>{ if(!el.isConnected) return clearInterval(window.__cd);
    let s=Math.max(0,Math.floor((target-Date.now())/1000));
    if(s===0){ el.innerHTML=`<div><strong>¡Hoy!</strong><span>Día D</span></div>`; return }
    const dd=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
    el.innerHTML=[[dd,"días"],[h,"horas"],[m,"min"],[s,"seg"]].map(([v,l])=>`<div><strong>${String(v).padStart(2,"0")}</strong><span>${l}</span></div>`).join("") };
  f(); clearInterval(window.__cd); window.__cd=setInterval(f,1000);
}

// ================== Panel de la central (organizador) ==================
async function renderAdmin(){
  stopTimers();
  const key=store.get(ADMIN_KEY);

  try{ A=await api("/api/admin/state",null,key) }
  catch(e){ if(e.status===403){ store.set(ADMIN_KEY,null); return renderError("La clave de organizador no vale. Abre otra vez tu enlace de organizador.", renderHome) } return renderError(e.message, renderAdmin) }
  const c=A.cfg, n=A.people.length, joined=A.people.filter(p=>p.joined).length, ready=A.people.filter(p=>p.joined&&p.items).length;

  </header>

  </section>

  <section class="panel" aria-labelledby="h-st">
    <div class="head"><h2 id="h-st">2 · Seguimiento</h2><span class="label">${joined}/${n} registrados · ${ready}/${n} con carta</span></div>
    <div class="progress" aria-hidden="true"><span style="width:${n?ready/n*100:0}%"></span></div>
    <div class="tbl"><table>
      <thead><tr><th>Agente</th><th>Registro</th><th>Deseos</th><th></th></tr></thead>
      <tbody>${A.people.map(p=>`<tr>
        <td><b>${esc(p.name)}</b></td>
        <td>${p.locked?`<span class="pill lock">Bloqueado 10 min</span>`:p.joined?`<span class="pill ok">Registrado</span>`:`<span class="pill no">Pendiente</span>`}</td>
        <td>${p.items}</td>
        <td>${p.joined&&!A.drawn?`<button class="btn sm ghost" data-reset="${esc(p.name)}">Resetear PIN</button>`:""}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="note">«Resetear PIN» sirve si alguien olvida su PIN antes del sorteo. Su carta no se borra.</p>
    <span class="msg" id="rmsg" role="status"></span>
  </section>

  <section class="panel" aria-labelledby="h-op">

    <div class="grid">

    <label class="switch" for="mi"><input type="checkbox" id="mi" ${c.missions?"checked":""} ${A.drawn?"disabled":""}>

    <div class="row"><button class="btn" id="saveCfg">Guardar ajustes</button><span class="msg" id="cmsg" role="status"></span></div>

        <div class="row">
          <select class="inp" id="xa" aria-label="Agente A">${A.people.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><span>⇄</span>

      ${A.sealed

        ${A.sealed?"":`<button class="btn sm ghost" id="undo">Deshacer el sorteo</button>`}</div>
      <div class="row" id="undoC" hidden><span>Se borrarán los resultados y habrá que sortear de nuevo. ¿Seguro?</span><button class="btn sm danger" id="undoY">Sí, deshacer</button><button class="btn sm" id="undoN">Cancelar</button></div>`
    :`

      <div class="row"><button class="btn big" id="go" ${missing.length?"disabled":""}>Ejecutar sorteo</button></div>

  const call=async(path,body,msgEl)=>{ try{ await api(path,body,key); renderAdmin() }catch(e){ $(msgEl).textContent=e.message } };
  $("#home").onclick=renderHome;
  $("#cpy").onclick=()=>{ const b=$("#cpy"); try{ navigator.clipboard.writeText(PAGE).then(()=>b.textContent="¡Copiado!",()=>b.textContent=PAGE) }catch{ b.textContent=PAGE } };
  $("#saveCfg").onclick=async()=>{ try{ await api("/api/admin/config",{cfg:cfgBody()},key); $("#cmsg").className="msg good"; $("#cmsg").textContent="Guardado." }catch(e){ $("#cmsg").className="msg"; $("#cmsg").textContent=e.message } };
  $$("[data-reset]").forEach(b=>b.onclick=()=>{ if(b.dataset.armed){ call("/api/admin/resetpin",{name:b.dataset.reset},"#rmsg") } else { b.dataset.armed=1; b.textContent="¿Seguro? Pulsa otra vez" } });

    try{ const B=await api("/api/admin/state",null,key); if(JSON.stringify(B.people)!==JSON.stringify(A.people)||B.drawn!==A.drawn||B.sealed!==A.sealed) renderAdmin() }catch{} },20000);
}

// ================== Papel triturado (confeti) ==================
function shreds(ms){
  if(reduced()) return;
  const c=$("#fx"); c.hidden=false; const ctx=c.getContext("2d"), d=devicePixelRatio||1;
  c.width=innerWidth*d; c.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0);
  const cols=["#e2cc98","#d3b979","#d2323c","#f4e7c3","#ffc857"];
  const P=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:Math.random()*3+2,
    w:Math.random()*4+3,h:Math.random()*16+10,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:cols[rnd(cols.length)],ph:Math.random()*6}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.ph+=.08; p.x+=p.vx+Math.sin(p.ph)*1.2; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(Math.cos(p.ph),1); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore() });
    if(t-t0<ms) requestAnimationFrame(f); else { ctx.clearRect(0,0,innerWidth,innerHeight); c.hidden=true }
  })(t0);
}

// ================== Arranque ==================
(async function boot(){
  const m=location.hash.match(/^#admin=([\w-]+)$/);
  if(m){ store.set(ADMIN_KEY,m[1]); history.replaceState(null,"",location.pathname); return renderAdmin() }
  const me=store.get(ME_KEY);
  if(me&&me.name&&me.pin){
    try{ await loadState(); await enterAgent(me.name,me.pin); return }
    catch(e){ if(e.status===401||e.status===404||e.status===409) store.set(ME_KEY,null) }
  }
  renderHome();
})();
